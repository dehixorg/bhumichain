services:
  # ─── API Gateway ───────────────────────────────────────────────────────────
  - type: web
    name: bhumichain-api-gateway
    env: node
    region: singapore
    rootDir: backend/api-gateway
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FABRIC_MODE
        value: mock
      - key: CORS_ORIGIN
        value: "*"
      - key: ORACLE_SERVICE_URL
        fromService:
          type: web
          name: bhumichain-oracle-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: RECORD_SCAN_URL
        fromService:
          type: web
          name: bhumichain-record-scan
          envVarKey: RENDER_EXTERNAL_URL
      - key: NYAYA_URL
        fromService:
          type: web
          name: bhumichain-nyaya-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: COPARCENARY_URL
        fromService:
          type: web
          name: bhumichain-coparcenary
          envVarKey: RENDER_EXTERNAL_URL
      - key: SETTLE_URL
        fromService:
          type: web
          name: bhumichain-settle
          envVarKey: RENDER_EXTERNAL_URL
      - key: BHUMIBOT_SERVICE_URL
        fromService:
          type: web
          name: bhumichain-bhumibot
          envVarKey: RENDER_EXTERNAL_URL

  # ─── Oracle Service ─────────────────────────────────────────────────────────
  - type: web
    name: bhumichain-oracle-service
    env: python
    region: singapore
    rootDir: backend/oracle-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ORACLE_MODE
        value: mock

  # ─── RecordScan AI ──────────────────────────────────────────────────────────
  - type: web
    name: bhumichain-record-scan
    env: python
    region: singapore
    rootDir: backend/ai-services/record-scan
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RECORD_SCAN_MODE
        value: real

  # ─── Nyaya AI ───────────────────────────────────────────────────────────────
  - type: web
    name: bhumichain-nyaya-ai
    env: python
    region: singapore
    rootDir: backend/ai-services/nyaya-ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

  # ─── Coparcenary Mapper ─────────────────────────────────────────────────────
  - type: web
    name: bhumichain-coparcenary
    env: python
    region: singapore
    rootDir: backend/ai-services/coparcenary-mapper
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

  # ─── Bhumi Settle ───────────────────────────────────────────────────────────
  - type: web
    name: bhumichain-settle
    env: python
    region: singapore
    rootDir: backend/ai-services/bhumi-settle
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

  # ─── BhumiBot ───────────────────────────────────────────────────────────────
  - type: web
    name: bhumichain-bhumibot
    env: python
    region: singapore
    rootDir: backend/ai-services/bhumibot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
